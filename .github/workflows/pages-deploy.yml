name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.2
          bundler-cache: true
      
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"


      # ========== 新增：StatiCrypt 加密开始 ==========
      - name: Setup Node.js for staticrypt
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install staticrypt
        run: npm install -g staticrypt
      - name: Encrypt private pages
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASS }}
        run: |
          # 统一使用 Jekyll 真实输出目录
          SITE_DIR="_site${{ steps.pages.outputs.base_path }}"
          echo "👉 Target site directory: ${SITE_DIR}"
          ls -la "${SITE_DIR}"
          # 加密 private 下所有html，增加判断：目录不存在则跳过不报错
          if [ -d "${SITE_DIR}" ]; then
            find "${SITE_DIR}" -type f -name "*.html" | xargs -I {} staticrypt "{}" -p "${STATICRYPT_PASSWORD}" --short
            find "${SITE_DIR}" -name "*.bak" -delete
            echo "✅ 私密页面加密完成"
          else
            echo "⚠️ ${SITE_DIR}/private 目录不存在，跳过加密"
          fi
        shell: /usr/bin/bash -e {0}
      # ========== 新增：StatiCrypt 加密结束 ==========


      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external=true \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/,/^http://www.quantum-simulation.org/potentials/$/"
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.2
          bundler-cache: true
      
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"


      # ========== 新增：StatiCrypt 加密开始 ==========
      - name: Setup Node.js for staticrypt
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Encrypt posts article html (mv overwrite mode, fully compatible)
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          SITE_DIR="_site${{ steps.pages.outputs.base_path }}"
          echo "👉 Target site directory: ${SITE_DIR}"
          find "${SITE_DIR}" -name "*.bak" -delete
          echo "🧹 Pre cleaned *.bak"

          # Check template exists
          if [ ! -f staticrypt-template.html ]; then
            echo "❌ ERROR: staticrypt-template.html NOT FOUND in repo root!"
            exit 1
          fi
          echo "✅ Template file found"

          if [ -d "${SITE_DIR}/posts" ]; then
            echo "🔍 Files to be encrypted:"
            find "${SITE_DIR}/posts" -mindepth 2 -type f -name "*.html"
            
            while IFS= read -r -d '' file; do
              echo "🔐 Encrypting: $file"
              # write to temp file first
              npx staticrypt "$file" -p "${STATICRYPT_PASSWORD}" --short --template staticrypt-template.html -o "${file}.tmp"
              # replace original
              mv "${file}.tmp" "$file"
              rm -f "${file}.bak"
            done < <(find "${SITE_DIR}/posts" -mindepth 2 -type f -name "*.html" -print0)

            echo "✅ posts博文加密 completed"
            ls -la "${SITE_DIR}/posts/gpt-api/"
            
            FIRST_HTML=$(find "${SITE_DIR}/posts" -mindepth 2 -type f -name "*.html" | head -n1)
            echo "📄 Check encrypted html head: ${FIRST_HTML}"
            head -c 500 "${FIRST_HTML}"
          else
            echo "⚠️ posts dir not found"
          fi
        shell: /usr/bin/bash -e {0}
      # ========== 新增：StatiCrypt 加密结束 ==========


      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external=true \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/,/^http://www.quantum-simulation.org/potentials/$/"
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

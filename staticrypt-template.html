<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 精简viewport，移除会导致WebView渲染异常的多余参数 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔒 受保护文章</title>
<style>
:root {
  --sc-bg: #ffffff;
  --sc-text: #212529;
  --sc-border: #d1d5db;
  --sc-primary: #4083c1;
  --sc-primary-h: #2e689c;
  --sc-error: #ef4444;
  --sc-shadow: rgba(0,0,0,0.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --sc-bg: #1b1b1e;
    --sc-text: #e5e7eb;
    --sc-border: #444950;
  }
}
* { box-sizing: border-box; margin:0; padding:0; }
body {
  min-height: 100vh;
  background: var(--sc-bg);
  color: var(--sc-text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.sc-card {
  width: 100%;
  max-width: 460px;
  padding: 2.2rem;
  border-radius: 18px;
  border: 1px solid var(--sc-border);
  box-shadow: 0 10px 30px var(--sc-shadow);
}
.sc-title {
  font-size: 1.5rem;
  text-align: center;
  margin-bottom: 0.8rem;
}
.sc-desc {
  text-align: center;
  margin-bottom: 1.6rem;
  opacity: 0.84;
  line-height: 1.55;
}
#staticrypt-password {
  width: 100%;
  padding: 0.9rem 1rem;
  font-size: 1rem;
  border: 1px solid var(--sc-border);
  border-radius: 10px;
  background: transparent;
  color: var(--sc-text);
  outline: none;
  margin-bottom: 1rem;
}
#staticrypt-password:focus {
  border-color: var(--sc-primary);
  box-shadow: 0 0 0 3px rgba(64,131,193,0.2);
}
#unlockBtn {
  width: 100%;
  padding: 0.9rem;
  border: none;
  border-radius: 10px;
  background: var(--sc-primary);
  color: #fff;
  font-size: 1rem;
  cursor: pointer;
  transition: background 0.22s ease;
}
#unlockBtn:hover {
  background: var(--sc-primary-h);
}
#unlockBtn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
#staticrypt-error {
  color: var(--sc-error);
  text-align: center;
  margin-top: 0.8rem;
  display: none;
}
.sc-loading {
  text-align: center;
  margin-top: 0.8rem;
  opacity:0.75;
  display: none;
}
</style>
</head>
<body>
<div class="sc-card">
  <h2 class="sc-title">🔒 受保护文章</h2>
  <p class="sc-desc">输入访问密码，解锁文章内容</p>
  <input type="password" id="staticrypt-password" placeholder="请输入密码" autocomplete="off">
  <button id="unlockBtn">解锁文章</button>
  <div class="sc-loading" id="loadingTxt">解密中，请稍候…</div>
  <p id="staticrypt-error">❌ 密码错误，请重试</p>
</div>

<script>
// StatiCrypt 固定占位符，不可修改/删除
var staticryptEncryptedContent = /*[|encryptedContent|]*/0;
var staticryptSalt = /*[|salt|]*/0;
var staticryptIv = /*[|iv|]*/0;
var staticryptHint = /*[|hint|]*/0;

let isDecrypting = false;

async function staticryptDecrypt() {
  if(isDecrypting) return;
  const pwInput = document.getElementById("staticrypt-password");
  const btn = document.getElementById("unlockBtn");
  const errDom = document.getElementById("staticrypt-error");
  const loadingDom = document.getElementById("loadingTxt");
  const pass = pwInput.value.trim();
  if(!pass) return;

  isDecrypting = true;
  btn.disabled = true;
  loadingDom.style.display = "block";
  errDom.style.display = "none";

  // setTimeout让出主线程，解决老旧WebView直接卡死转圈
  setTimeout(async ()=>{
    try {
      const html = await staticrypt.decrypt(pass, staticryptEncryptedContent, staticryptSalt, staticryptIv);
      document.body.innerHTML = html;
    } catch(e) {
      errDom.style.display="block";
      console.error("Decrypt error:",e);
    } finally {
      isDecrypting = false;
      btn.disabled = false;
      loadingDom.style.display = "none";
    }
  }, 60);
}

// 回车快捷解锁
document.getElementById("staticrypt-password").addEventListener("keydown", function(e){
  if(e.key === "Enter") staticryptDecrypt();
});
document.getElementById("unlockBtn").addEventListener("click", staticryptDecrypt);
</script>
<!-- defer 延迟加载JS：页面DOM、密码框优先渲染，不会空白转圈！ -->
<script src="https://cdn.jsdelivr.net/npm/staticrypt@3.5.4/dist/staticrypt.min.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Protected Page</title>
</head>
<body>
  <div class="staticrypt-container">
    <h2>This page is password protected</h2>
    <p>Please enter password:</p>
    <input type="password" id="staticrypt-password" placeholder="Password" />
    <button onclick="staticryptDecrypt()">Unlock</button>
    <p id="staticrypt-error" style="color:red;display:none">Wrong password</p>
  </div>
  <script>
    var staticryptEncryptedContent = "{encryptedContent}";
    var staticryptSalt = "{salt}";
    var staticryptIv = "{iv}";
    var staticryptHint = "{hint}";
  </script>
  <script src="https://cdn.jsdelivr.net/npm/staticrypt@3.5.4/dist/staticrypt.min.js"></script>
</body>
</html>
